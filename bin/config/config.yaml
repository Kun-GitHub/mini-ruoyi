# mini-ruoyi 配置样例。
#
# 用法：复制为 config/config.yaml 再按需修改。
#   cp config/config.example.yaml config/config.yaml
#
# 不改也能跑——所有项都有内置默认值，这份文件只写你要覆盖的项即可。
#
# 优先级：环境变量 > 配置文件 > 内置默认值。
# 环境变量优先是为了让 systemd / 容器能覆盖单个值，而不必去改文件。
#
# ⚠️ config.yaml 已在 .gitignore 中：它含部署相关信息（监听地址、代理地址），
#    每个部署都不一样，不该进版本库。

server:
  # HTTP 监听地址
  addr: ":8080"
  # 设为 dev 时使用 gin 的调试模式（输出路由表与警告日志）
  env: prod

  # 给会话 cookie 加 Secure 标记。
  # 本服务自身不监听 TLS，所以默认 false；
  # 前面有 TLS 终止层（nginx 等）时必须设为 true。
  secure_cookie: false

  # 可信反向代理的 IP / CIDR 列表。
  #
  # 默认必须为空：本服务可以直接对外监听，无条件采信 X-Forwarded-For
  # 会让客户端随便伪装成任意 IP，按 IP 限流形同虚设。
  #
  # 但反过来，放在 nginx 后面时必须填上代理地址，否则所有请求的来源 IP
  # 都是 127.0.0.1 —— 按 IP 限流会退化成全局限流（一个人刷满 20 rps，
  # 所有人一起 429），登录日志里的 IP 也全是代理地址。
  trusted_proxies: []
  # trusted_proxies: ["127.0.0.1", "10.0.0.0/8"]

  rate_limit:
    # 每个 IP 的限流速率与瞬时突发量。
    # 批量运维操作（导入用户、批删）被自己的限流挡住时调大这两个值。
    rps: 20
    burst: 40

database:
  # SQLite 文件路径，相对进程工作目录。
  # 故意不跟二进制走：数据库常放在数据盘或挂载卷上。
  path: data.db

web:
  # 前端构建产物目录。
  # 留空表示自动查找：二进制同级 web/ → ./web → ../bin/web → bin/web。
  # 自动查找是为了让 go run 和 IDE 启动也能找到产物（那时二进制在临时目录里）。
  dir: ""

upload:
  # 文件本体的存放目录，相对进程工作目录
  dir: uploads
  # 单文件上限（MiB）
  max_mb: 20
  # 所有文件的总容量上限（MiB），不能小于 max_mb
  quota_mb: 512

log:
  # 操作日志与登录日志的保留天数。
  # 日志表只增不改，不设上限迟早会把磁盘吃满。
  retention_days: 30
